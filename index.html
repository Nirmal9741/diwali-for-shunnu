<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali Shunnu 🪔</title>
<meta name="description" content="A special Diwali surprise made with love by Munnu for Shunnu ❤️">
<meta property="og:title" content="Happy Diwali Shunnu 🪔">
<meta property="og:description" content="A special Diwali surprise made with love by Munnu for Shunnu ❤️">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0e0322;--sky2:#2d0a45;--sky3:#7a1b4b;--gold:#ffc857;--rose:#ff6b9d;--ink:#fff1db;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#0e0322;--sky2:#2d0a45;--sky3:#7a1b4b;--ink:#fff1db}}
:root[data-theme="dark"]{--sky1:#0e0322}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 78%,rgba(255,170,60,.45),transparent 55%);opacity:.25;transition:opacity 2.5s}
body.lit::before{opacity:1}
#stars i{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.lantern{position:fixed;bottom:-70px;width:30px;height:40px;border-radius:12px 12px 8px 8px;background:linear-gradient(#ffb347,#ff6a3d);box-shadow:0 0 22px 6px rgba(255,170,60,.55);z-index:1;animation:rise linear forwards}
.lantern::before{content:"";position:absolute;left:50%;top:-8px;width:2px;height:8px;background:var(--gold)}
.lantern::after{content:"";position:absolute;left:6px;right:6px;bottom:-9px;height:9px;border-radius:0 0 8px 8px;background:var(--gold);opacity:.8}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(22px,-55vh)}100%{transform:translate(-14px,-120vh)}}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity 1.2s,transform 1.2s}
body.lit #intro{opacity:0;transform:scale(1.4);pointer-events:none}
#intro button{background:none;border:0;cursor:pointer;position:relative;padding:20px;-webkit-tap-highlight-color:transparent}
#intro button::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
#intro p{margin:0;font-size:1.15rem;font-weight:500;max-width:18em;line-height:1.5}
#intro .hi{font-family:'Great Vibes',cursive;font-size:2.4rem;color:var(--gold)}
#main{position:fixed;inset:0;z-index:4;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 28px;text-align:center;opacity:0;pointer-events:none;transition:opacity 2s 1.2s}
body.lit #main{opacity:1;pointer-events:auto}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(3rem,13vw,5.4rem);margin:0;line-height:1.05;background:linear-gradient(90deg,#ffd166,#ff8fab,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,190,90,.5))}
.to{font-size:1.15rem;margin:4px 0 0;letter-spacing:.02em}
.to b{font-family:'Great Vibes',cursive;font-size:2rem;font-weight:400;color:var(--rose)}
#couple{width:min(92vw,420px);height:auto;margin:6px 0 0;overflow:visible}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
.bob.b2{animation-delay:-1.1s}
@keyframes bob{to{transform:translateY(-5px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.spin{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .18s ease-in-out infinite alternate;opacity:0;transition:opacity 1s}
body.lit .flame,.flame.on{opacity:1}
@keyframes fl{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.9,1.12) skewX(4deg)}}
.glow{animation:pulse 2.4s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
#hearts{position:relative;width:100%;height:0}
#hearts span{position:absolute;bottom:60px;font-size:20px;animation:hf 4s ease-out forwards}
@keyframes hf{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-190px) scale(1.2);opacity:0}}
#msg{min-height:5.6em;max-width:21em;margin:10px auto 0;padding:14px 20px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,200,87,.35);backdrop-filter:blur(6px);font-size:1.12rem;line-height:1.55;display:flex;align-items:center;justify-content:center;transition:opacity .7s;cursor:pointer}
#msg.out{opacity:0}
#sign{font-family:'Great Vibes',cursive;font-size:1.9rem;color:var(--gold);margin:10px 0 0;min-height:1.2em}
#wish{margin-top:12px;border:0;border-radius:999px;padding:13px 28px;font:700 1rem 'Quicksand',sans-serif;color:#3a0a2a;background:linear-gradient(90deg,#ffd166,#ff8fab);cursor:pointer;box-shadow:0 0 26px rgba(255,150,120,.55)}
#wish:active{transform:scale(.96)}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,200,87,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(6px);color:var(--ink);font-size:1.2rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.5s 2s}
body.lit #mute{opacity:1;pointer-events:auto}
#story{position:fixed;inset:0;z-index:8;background:#07020f;display:none;align-items:center;justify-content:center}
#story.on{display:flex}
body.fin #fx{z-index:9}
#stage{position:relative;width:min(100vw,calc(100vh*.643),460px);aspect-ratio:360/560;overflow:hidden;background:#000}
#sc{width:100%;height:100%;display:block}
#cap{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 24px;text-align:center;font-size:1.05rem;font-weight:700;line-height:1.5;background:linear-gradient(transparent,rgba(7,2,15,.88) 60%);transition:opacity .6s;pointer-events:none}
#prog{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:56px;right:66px;display:flex;gap:4px;z-index:2}
#prog i{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:2px;overflow:hidden}
#prog b{display:block;height:100%;width:0;background:var(--gold)}
#prog .done b{width:100%}
#prog .cur b{animation:fillp linear forwards}
@keyframes fillp{to{width:100%}}
#sx{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:1.1rem;cursor:pointer}
#end{position:absolute;left:0;right:0;bottom:120px;display:flex;gap:10px;justify-content:center;z-index:2}
#end[hidden]{display:none}
#end button{border:0;border-radius:999px;padding:10px 20px;font:700 .95rem 'Quicksand',sans-serif;color:#3a0a2a;background:linear-gradient(90deg,#ffd166,#ff8fab);cursor:pointer}
.pop{opacity:0;animation:popin .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes popin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.tws{animation:tw 3s ease-in-out infinite}
.dash{stroke-dasharray:4 7;animation:dsh 1s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-22}}
.fo{animation:fadeo .4s 2.4s forwards}
.fi{opacity:0;animation:fadei .4s 2.6s forwards}
@keyframes fadeo{to{opacity:0}}
@keyframes fadei{to{opacity:1}}
.hrt{animation:hrise 4s ease-out infinite;opacity:0}
@keyframes hrise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-170px);opacity:0}}
.wl{transform:translateX(-130px);animation:wk 3.6s ease-out forwards}
.wr{transform:translateX(130px);animation:wk 3.6s ease-out forwards}
@keyframes wk{to{transform:translateX(0)}}
.dance{animation:dn 1s ease-in-out infinite}
@keyframes dn{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
.stir{animation:sr .9s ease-in-out infinite alternate}
@keyframes sr{to{transform:translateX(-12px)}}
.chop{animation:cp .35s ease-in infinite alternate}
@keyframes cp{to{transform:translateY(9px)}}
.stm{transform-box:fill-box;transform-origin:center;animation:sm 2.2s ease-out infinite;opacity:0}
@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.7}100%{transform:translateY(-80px) scale(1.8);opacity:0}}
.cf{animation:cf 4s linear infinite}
@keyframes cf{from{transform:translateY(-20px)}to{transform:translateY(580px)}}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.bob,.spin,.lantern,#hearts span{animation:none}}
</style>
</head>
<body>
<div id="stars"></div>

<section id="intro">
  <div class="hi">Something special is waiting…</div>
  <button id="light" aria-label="Light the diya">
    <svg width="150" height="130" viewBox="0 0 150 130">

      <circle cx="82" cy="122" r="4" fill="#ff8fa3" opacity=".6"/><circle cx="108" cy="122" r="4" fill="#ff8fa3" opacity=".6"/>
      <path d="M90 123 Q95 128 100 123" fill="none" stroke="#b3475f" stroke-width="1.8" stroke-linecap="round"/>

      <ellipse class="blink" cx="218" cy="116" rx="2.4" ry="3" fill="#1c1022"/><ellipse class="blink" cx="232" cy="116" rx="2.4" ry="3" fill="#1c1022"/>
      <circle cx="212" cy="124" r="4" fill="#ff8fa3" opacity=".5"/><circle cx="238" cy="124" r="4" fill="#ff8fa3" opacity=".5"/>

</main>
<div id="story" aria-label="Our journey">
  <div id="stage">
    <svg id="sc" viewBox="0 0 360 560" role="img" aria-label="Story scene"></svg>

  </div>

<button id="mute" aria-label="Turn music on or off">🔊</button>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var parts=(function(){
  try{
    var h=decodeURIComponent(location.hash.slice(1));
    return h?h.split('-'):[];
  }catch(e){return []}
})();
var her=parts[0]?(parts[0].charAt(0).toUpperCase()+parts[0].slice(1)):'Shunnu';
$('#name').textContent=her;
var me=parts[1]?(parts[1].charAt(0).toUpperCase()+parts[1].slice(1)):'Munnu';
$('#sign').textContent='Forever yours, '+me+' ❤️';

var st=$('#stars');
for(var i=0;i<70;i++){var s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.animationDelay=Math.random()*3+'s';s.style.transform='scale('+(.6+Math.random()*1.2)+')';st.appendChild(s)}

var pet='';
for(var k=0;k<12;k++){pet+='<ellipse cx="0" cy="-82" rx="15" ry="34" fill="'+(k%2?'#ff6b9d':'#ffc857')+'" transform="rotate('+k*30+')"/>'}
for(var k2=0;k2<12;k2++){pet+='<ellipse cx="0" cy="-122" rx="7" ry="12" fill="'+(k2%2?'#fff1db':'#ff9f43')+'" transform="rotate('+(k2*30+15)+')"/>'}
$('#pet').innerHTML=pet;

var cv=$('#fx'),cx=cv.getContext('2d'),W,H,dpr=Math.min(window.devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();
var sparks=[],petals=[],lit=false;
var cols=['#ffc857','#ff6b9d','#ff9f43','#c77dff','#fff1db','#ff5d5d','#7df9ff'];
function burst(x,y){boom(x);var a=cols[Math.random()*cols.length|0],b=cols[Math.random()*cols.length|0];for(var i=0;i<64;i++){var an=i/64*6.283,sp=2+Math.random()*3.6;sparks.push({x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:1,c:i%2?a:b})}}
function mk(init){petals.push({x:Math.random()*W,y:init?Math.random()*H:-20,s:5+Math.random()*7,vy:.6+Math.random(),vx:(Math.random()-.5)*.6,r:Math.random()*6,vr:(Math.random()-.5)*.05,ph:Math.random()*6,c:['#ffb000','#ff8c00','#ff4f81','#ff7aa8','#ffd166'][Math.random()*5|0]})}
for(var p0=0;p0<36;p0++)mk(1);
function loop(){
  cx.clearRect(0,0,W,H);
  if(lit){petals.forEach(function(p){p.y+=p.vy;p.ph+=.02;p.x+=p.vx+Math.sin(p.ph)*.6;p.r+=p.vr;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=.85;cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,p.s,p.s*.55,0,0,6.283);cx.fill();cx.restore()})}
  cx.globalCompositeOperation='lighter';
  sparks=sparks.filter(function(q){return q.l>0});
  sparks.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.vx*=.97;q.vy=q.vy*.97+.04;q.l-=.014;cx.globalAlpha=Math.max(q.l,0);cx.fillStyle=q.c;cx.beginPath();cx.arc(q.x,q.y,2.2,0,6.283);cx.fill()});
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
  requestAnimationFrame(loop)
}
loop();

function lantern(){var l=document.createElement('div');l.className='lantern';l.style.left=Math.random()*92+'%';var d=14+Math.random()*10;l.style.animationDuration=d+'s';l.style.transform='scale('+(.7+Math.random()*.8)+')';document.body.appendChild(l);setTimeout(function(){l.remove()},d*1000)}
function heart(){var h=document.createElement('span');h.textContent=['💖','💛','🪔','✨'][Math.random()*4|0];h.style.left=(42+Math.random()*16)+'%';$('#hearts').appendChild(h);setTimeout(function(){h.remove()},4000)}

var msgs=[
 'May every diya you light bring a little more joy into your life, '+her+'. 🪔',
 'You are the brightest light in my life, my forever Diwali. ✨',
 'With you, every single day feels like a festival, '+her.'.',
 'May this Diwali wrap you in love, laughter and the sweetest moments.',
 'Thank you for being you. Happy Diwali, my love ❤️'
];
var mi=0,m=$('#msg');
function show(){
  m.classList.add('out');
  setTimeout(function(){
    m.textContent=msgs[mi];
    m.classList.remove('out');
    $('#sign').textContent='Forever yours, '+me+' ❤️';
    mi=(mi+1)%msgs.length;
  },600);
}
m.addEventListener('click',show);

var ac,master,bus,nb,musicOn=true,idx=4,dur=[.6,.9,1.2],nl=2.2,vol=.16,bell=.12,wv='triangle';
var sc=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];
function pluck(f,t,d,v){var o=ac.createOscillator();o.type=wv;o.frequency.value=f;var o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2;var g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);var g2=ac.createGain();g2.gain.value=.3;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(bus);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function boom(x){if(!ac||!musicOn||!nb)return;try{var t=ac.currentTime,out=master;if(ac.createStereoPanner){var pn=ac.createStereoPanner();pn.pan.value=Math.max(-1,Math.min(1,x/W*2-1));pn.connect(master);out=pn}
  var o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.35);var g=ac.createGain();g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(out);o.start(t);o.stop(t+.5);
  var n=ac.createBufferSource();n.buffer=nb;var f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(300,t+.4);var ng=ac.createGain();ng.gain.setValueAtTime(.8,t);ng.gain.exponentialRampToValueAtTime(.001,t+.5);n.connect(f);f.connect(ng);ng.connect(out);n.start(t);n.stop(t+.6);
